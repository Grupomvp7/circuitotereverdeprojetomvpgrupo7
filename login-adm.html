<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Circuito Terê Verde</title>
    <link rel="stylesheet" href="estilopaginaadm.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="script.js"></script> 
</head>

<body>
    
    <div class="dashboard-container">

        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-leaf"></i>
                <h3>Painel</h3>
            </div>
            <nav class="nav-menu">
                <a href="#overview" class="active"><i class="fas fa-chart-line"></i> Visão Geral</a>
                <a href="#trilhas"><i class="fas fa-route"></i> Trilhas</a>
                <a href="#cachoeiras"><i class="fas fa-water"></i> Cachoeiras</a>
                <a href="#eventos"><i class="fas fa-calendar-alt"></i> Eventos</a>
                <a href="#relatorios"><i class="fas fa-users"></i> Relatórios de Usuários</a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="header">
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                    <span id="adminNameDisplay">Administrador</span>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </header>

            <section id="overview" class="content-section active">
                <h3>Informações dos Cadastros</h3>
                <div class="stats-cards">
                    <div class="card"><i class="fas fa-route"></i> **Trilhas:** 9 cadastradas</div>
                    <div class="card"><i class="fas fa-water"></i> **Cachoeiras:** 4 cadastradas</div>
                    <div class="card"><i class="fas fa-calendar-alt"></i> **Eventos:** 3 cadastradas</div> 
                </div>
            </section>
            
            <section id="trilhas" class="content-section">
                <h3>🌿 Gestão de Trilhas</h3>
                </section>
            
            <section id="cachoeiras" class="content-section">
                <h3>💧 Gestão de Cachoeiras</h3>
                </section>
            
            <section id="eventos" class="content-section">
                <h3>📅 Gestão de Eventos</h3>
                </section>
            
            <section id="relatorios" class="content-section">
                <h3>👥 Relatórios de Usuários</h3>
                </section>

        </main>
    </div>

</body>
</html>
