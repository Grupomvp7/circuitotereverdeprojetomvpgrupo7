<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Circuito Terê Verde</title>
    <link rel="stylesheet" href="estilopaginalogin.css"> 
    
    <script src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    
    <div id="login-view">
        <div class="wrapper">
            
            <div class="logo-area">
                <div class="logo-circle">
                    🌿 
                </div>
                <h1 class="title">Circuito Terê Verde</h1>
                <p class="subtitle" id="login-subtitle">Acesso de Usuário</p>
            </div>
    
            <div class="container" id="userLoginBox">
                <h2>Acesso de Usuário</h2>

                <div class="input-group">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="text" id="userLoginUser" placeholder="E-mail ou Usuário" />
                </div>

                <div class="input-group">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="userLoginPass" placeholder="Senha" />
                </div>

                <button onclick="loginUser()">Entrar</button>
                
                <div class="link" onclick="showAdminLogin()">Acesso Administrativo</div>
                <div class="link" onclick="showUserRegister()">Cadastrar-se</div>
                
                <p class="back-home-container">
                    <a href="index.html" class="back-home-btn">Voltar para a Home</a>
                </p>
            </div>

            <div class="container" id="adminLoginBox" style="display:none;">
                <h2>Login do Administrador</h2>

                <div class="input-group">
                    <span class="icon"><i class="fas fa-user-shield"></i></span>
                    <input type="text" id="loginUser" placeholder="Usuário Admin" />
                </div>

                <div class="input-group">
                    <span class="icon"><i class="fas fa-key"></i></span>
                    <input type="password" id="loginPass" placeholder="Senha Admin" />
                </div>

                <button onclick="loginAdmin()">Entrar</button>

                <div class="link" onclick="showUserLogin()">Voltar ao Login de Usuário</div>
                <div class="link" onclick="showRegister()">Cadastrar novo administrador</div>
            </div>
            
            <div class="container" id="registerBox" style="display:none;"> 
                <h2>Cadastrar Administrador</h2>
                <div class="input-group">
                    <span class="icon">📛</span>
                    <input type="text" id="registerName" placeholder="Nome completo" />
                </div>
                <div class="input-group">
                    <span class="icon">📧</span>
                    <input type="email" id="registerEmail" placeholder="E-mail" />
                </div>
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" id="registerUser" placeholder="Usuário" />
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="registerPass" placeholder="Senha" />
                </div>
                <button onclick="register()">Cadastrar</button>
                <div class="link" onclick="showAdminLogin()">Voltar ao Login Admin</div>
            </div>
            
            <div class="container" id="userRegisterBox" style="display:none;"> 
                <h2>Cadastrar Usuário</h2>
                <div class="input-group">
                    <span class="icon">📛</span>
                    <input type="text" id="userRegisterName" placeholder="Nome completo" />
                </div>
                <div class="input-group">
                    <span class="icon">📧</span>
                    <input type="email" id="userRegisterEmail" placeholder="E-mail" />
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="userRegisterPass" placeholder="Senha" />
                </div>
                <button onclick="registerUser()">Cadastrar</button>
                <div class="link" onclick="showUserLogin()">Voltar ao login</div>
            </div>
            
        </div>
    </div>
</body>
</html>
